name: Unpack Zip & Clean Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Clean old files, extract zip, and remove zip
        run: |
          set -e
          ZIP_FILE=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in repository root!"
            exit 1
          fi
          echo "Found zip: $ZIP_FILE"

          # Delete everything except .git, .github, and the zip file
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$ZIP_FILE" \
            -exec rm -rf {} +

          # Extract zip into repo root (skip .github/workflows unless GH_PAT is set)
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            unzip -o "$ZIP_FILE" -d .
          else
            unzip -o "$ZIP_FILE" -x ".github/workflows/*" -d .
          fi

          # Auto-delete the zip file
          rm -f "$ZIP_FILE"

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: replace repo contents with extracted zip"
            git push
          fi
